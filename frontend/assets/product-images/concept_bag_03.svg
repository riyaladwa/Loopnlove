<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F2"/>
      <stop offset="100%" stop-color="#EFE2D3"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#8C5E39" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad3)"/>
  
  <g filter="url(#shadow3)" transform="translate(170, 110)">
    <!-- Crossbody Long Strap -->
    <path d="M 20 80 C -30 -30, 270 -30, 220 80" fill="none" stroke="#A66F44" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Crossbody Bag Body (Square compact) -->
    <rect x="20" y="70" width="200" height="220" rx="14" fill="#FFFDF9" stroke="#C49B74" stroke-width="3"/>
    
    <!-- Sunburst Granny Center -->
    <g transform="translate(40, 95)">
      <!-- Outer Square -->
      <rect x="5" y="5" width="150" height="150" rx="10" fill="#FDF3E7" stroke="#E2B88F" stroke-width="2"/>
      <!-- Sunburst Spikes -->
      <circle cx="80" cy="80" r="48" fill="#F4A261"/>
      <circle cx="80" cy="80" r="32" fill="#E76F51"/>
      <circle cx="80" cy="80" r="16" fill="#E9C46A"/>
      <!-- Button Clasp -->
      <circle cx="80" cy="-8" r="8" fill="#7D4F27"/>
    </g>
  </g>

  <!-- Clear Concept Badge -->
  <rect x="110" y="460" width="380" height="42" rx="21" fill="#4A3428" opacity="0.92"/>
  <text x="300" y="486" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">
    PROPOSED DESIGN CONCEPT
  </text>

  <text x="300" y="530" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#8C4A50">
    Vintage Sunburst Crossbody Bag &bull; Custom Made-to-Order
  </text>
  <text x="300" y="552" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#7A6860">
    Estimated: ₹500–₹600 (Subject to consultation)
  </text>
</svg>
