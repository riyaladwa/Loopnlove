<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F5"/>
      <stop offset="100%" stop-color="#F6E7E2"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#8C4A50" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad1)"/>
  
  <!-- Subtle Grid Pattern representing yarn texture -->
  <g stroke="#EAD5CE" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="60" y1="0" x2="60" y2="600"/>
    <line x1="180" y1="0" x2="180" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="420" y1="0" x2="420" y2="600"/>
    <line x1="540" y1="0" x2="540" y2="600"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="360" x2="600" y2="360"/>
    <line x1="0" y1="480" x2="600" y2="480"/>
  </g>

  <!-- Bag Outline Illustration -->
  <g filter="url(#shadow1)" transform="translate(150, 110)">
    <!-- Straps -->
    <path d="M 60 70 C 60 -10, 240 -10, 240 70" fill="none" stroke="#C46D75" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Bag Body -->
    <rect x="30" y="60" width="240" height="260" rx="16" fill="#FFF9F6" stroke="#D98A91" stroke-width="3"/>
    
    <!-- 4 Granny Squares representation -->
    <g transform="translate(45, 75)">
      <!-- Square 1 -->
      <rect x="5" y="5" width="95" height="105" rx="8" fill="#FCEEE9" stroke="#E5A6AC" stroke-width="2"/>
      <circle cx="52" cy="57" r="22" fill="#E8B4B8"/>
      <circle cx="52" cy="57" r="10" fill="#F4D06F"/>

      <!-- Square 2 -->
      <rect x="110" y="5" width="95" height="105" rx="8" fill="#F2E6DF" stroke="#D4A396" stroke-width="2"/>
      <circle cx="157" cy="57" r="22" fill="#A3B899"/>
      <circle cx="157" cy="57" r="10" fill="#FDFBF7"/>

      <!-- Square 3 -->
      <rect x="5" y="120" width="95" height="105" rx="8" fill="#F2E6DF" stroke="#D4A396" stroke-width="2"/>
      <circle cx="52" cy="172" r="22" fill="#A3B899"/>
      <circle cx="52" cy="172" r="10" fill="#FDFBF7"/>

      <!-- Square 4 -->
      <rect x="110" y="120" width="95" height="105" rx="8" fill="#FCEEE9" stroke="#E5A6AC" stroke-width="2"/>
      <circle cx="157" cy="172" r="22" fill="#E8B4B8"/>
      <circle cx="157" cy="172" r="10" fill="#F4D06F"/>
    </g>
  </g>

  <!-- Clear Concept Badge -->
  <rect x="110" y="460" width="380" height="42" rx="21" fill="#4A3428" opacity="0.92"/>
  <text x="300" y="486" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">
    PROPOSED DESIGN CONCEPT
  </text>

  <!-- Note Badge -->
  <text x="300" y="530" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#8C4A50">
    Daisy Bloom Granny-Square Tote &bull; Custom Made-to-Order
  </text>
  <text x="300" y="552" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#7A6860">
    Estimated: ₹500–₹600 (Subject to consultation)
  </text>
</svg>
